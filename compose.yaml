services:
  database:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ntu_events}
      POSTGRES_USER: ${POSTGRES_USER:-ntu_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntu_events}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ntu_events_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ntu_events} -d ${POSTGRES_DB:-ntu_events}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-ntu_events}
      POSTGRES_USER: ${POSTGRES_USER:-ntu_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntu_events}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      RAW_STORAGE_ROOT: /workspace/var/raw
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ntu_events_postgres_data:
