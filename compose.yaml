x-backend-service: &backend-service
  build:
    context: .
    dockerfile: apps/backend/Dockerfile
  image: ntu-events-backend:latest
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-secret}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    POSTGRES_DB: ${POSTGRES_DB:-ntu_events}
    POSTGRES_USER: ${POSTGRES_USER:-ntu_events}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntu_events}
    POSTGRES_HOST: database
    POSTGRES_PORT: 5432
    RAW_STORAGE_ROOT: /workspace/var/raw
    TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
    TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    TELEGRAM_SESSION_PATH: ${TELEGRAM_SESSION_PATH:-storage/telegram/sessions/ingestion}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_SCREENING_MODEL: ${OPENAI_SCREENING_MODEL:-gpt-5-nano}
    OPENAI_EXTRACTION_MODEL: ${OPENAI_EXTRACTION_MODEL:-gpt-5-mini}
  volumes:
    - .:/workspace
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ntu_events}
      POSTGRES_USER: ${POSTGRES_USER:-ntu_events}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ntu_events}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ntu_events_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ntu_events} -d ${POSTGRES_DB:-ntu_events}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    <<: *backend-service
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ingestion-worker:
    <<: *backend-service
    command:
      [
        "python",
        "apps/backend/manage.py",
        "run_ingestion_worker",
        "--poll-interval",
        "2",
      ]
    restart: unless-stopped

volumes:
  ntu_events_postgres_data:
