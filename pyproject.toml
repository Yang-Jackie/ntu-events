[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-events-ingestion"
version = "0.1.0"
description = "NTU Events backend and event-source ingestion tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "openai>=2.46,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "telethon>=1.42,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
telegram-ingestion = "ntu_events_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src", "apps/backend"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["src/*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
